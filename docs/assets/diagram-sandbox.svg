<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-label="PiShip policy connects through the sandbox contract to native or remote company sandbox backends">
  <rect x="0.5" y="0.5" width="799" height="399" rx="12" fill="#ffffff" stroke="#d1d9e0"/>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
    .m{fill:#59636e}
    .box{fill:#f6f8fa;stroke:#d1d9e0}
    .ln{stroke:#8c959f;fill:none}
    .ah{fill:#8c959f}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs>

  <rect x="280" y="14" width="240" height="52" rx="10" fill="#f97316" fill-opacity=".14" stroke="#f97316" stroke-width="1.5"/>
  <text x="400" y="46" text-anchor="middle" font-size="17" font-weight="600">PiShip policy</text>
  <text x="540" y="45" font-size="13" class="m">owns the policy decision</text>

  <path class="ln" d="M400 68V98" stroke-width="2" marker-end="url(#a)"/>

  <rect x="280" y="102" width="240" height="52" rx="10" class="box" stroke-width="1.5"/>
  <text x="400" y="134" text-anchor="middle" font-size="17" font-weight="600">Sandbox contract</text>

  <path class="ln" d="M360 156C360 180 205 176 205 200" stroke-width="2" marker-end="url(#a)"/>
  <path class="ln" d="M440 156C440 180 595 176 595 200" stroke-width="2" marker-end="url(#a)"/>

  <rect x="40" y="204" width="330" height="180" rx="14" fill="#bf3989" fill-opacity=".08" stroke="#bf3989" stroke-width="1.5"/>
  <text x="205" y="236" text-anchor="middle" font-size="16" font-weight="700">Native</text>
  <text x="205" y="256" text-anchor="middle" font-size="12" class="m">live-probed at launch</text>
  <g font-size="14" text-anchor="middle">
    <rect x="64" y="272" width="282" height="42" rx="8" class="box"/><text x="205" y="298">bubblewrap · Linux</text>
    <rect x="64" y="324" width="282" height="42" rx="8" class="box"/><text x="205" y="350">Seatbelt · macOS</text>
  </g>

  <rect x="430" y="204" width="330" height="180" rx="14" fill="#bf3989" fill-opacity=".08" stroke="#bf3989" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="595" y="236" text-anchor="middle" font-size="16" font-weight="700">Remote / company</text>
  <rect x="562" y="243" width="66" height="18" rx="9" fill="#9a6700" fill-opacity=".18" stroke="#9a6700"/>
  <text x="595" y="256" text-anchor="middle" font-size="11" font-weight="600">preview</text>
  <g font-size="14" text-anchor="middle">
    <rect x="454" y="272" width="136" height="48" rx="8" class="box"/><text x="522" y="301">custom adapter</text>
    <rect x="600" y="272" width="136" height="48" rx="8" class="box"/><text x="668" y="301">E2B-compatible</text>
    <rect x="454" y="328" width="136" height="48" rx="8" class="box"/><text x="522" y="357">CubeSandbox</text>
    <rect x="600" y="328" width="136" height="48" rx="8" class="box"/><text x="668" y="348">Kubernetes</text><text x="668" y="366">Agent Sandbox</text>
  </g>
</svg>
