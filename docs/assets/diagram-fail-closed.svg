<svg xmlns="http://www.w3.org/2000/svg" width="760" height="170" viewBox="0 0 760 170" role="img" aria-label="sandbox.required true plus sandbox unavailable results in SANDBOX_UNAVAILABLE, not running the command without a sandbox">
  <rect x="0.5" y="0.5" width="759" height="169" rx="12" fill="#ffffff" stroke="#d1d9e0"/>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
    .c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .m{fill:#59636e}
    .box{fill:#f6f8fa;stroke:#d1d9e0}
    .ln{stroke:#8c959f;fill:none}
    .ah{fill:#8c959f}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs>

  <rect x="16" y="20" width="250" height="44" rx="8" class="box" stroke-width="1.5"/>
  <text x="141" y="48" text-anchor="middle" font-size="15" class="c">sandbox.required: true</text>
  <text x="141" y="86" text-anchor="middle" font-size="20" class="m">+</text>
  <rect x="16" y="104" width="250" height="44" rx="8" class="box" stroke-width="1.5"/>
  <text x="141" y="132" text-anchor="middle" font-size="15">sandbox unavailable</text>

  <path class="ln" d="M282 84H336" stroke-width="2" marker-end="url(#a)"/>

  <rect x="350" y="20" width="394" height="56" rx="10" fill="#1a7f37" fill-opacity=".12" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="547" y="55" text-anchor="middle" font-size="17" font-weight="700" class="c">SANDBOX_UNAVAILABLE</text>

  <text x="547" y="100" text-anchor="middle" font-size="13" class="m">not</text>

  <rect x="350" y="112" width="394" height="44" rx="10" fill="#cf222e" fill-opacity=".08" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="547" y="139" text-anchor="middle" font-size="15" class="m">run the command without a sandbox</text>
  <path d="M424 134H670" stroke="#cf222e" stroke-width="2"/>
</svg>
