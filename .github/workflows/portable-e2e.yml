name: Portable E2E
# Full three-target installed E2E is nightly and manual integration
# evidence, not a pull request gate (see AGENTS.md, CI evidence tiers).
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  # Called from Release qualification, github.workflow names the caller; the
  # literal prefix keeps this group apart from its sibling reusable workflows.
  group: portable-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  portable:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Windows runners are ephemeral VMs whose C: drive is slow for the many
      # small files npm writes. Skip Defender scanning and keep temp output and
      # the npm cache on the runner's work drive.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "npm_config_cache=$env:RUNNER_TEMP\npm-cache" >> $env:GITHUB_ENV
          "npm_config_prefer_offline=true" >> $env:GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.x
          cache: npm
      - run: node -p "process.platform + '/' + process.arch + ' Node ' + process.version"
      # The OS sandbox tests need bubblewrap and unprivileged user
      # namespaces, which Ubuntu restricts through AppArmor by default.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --version
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code
      # Every target runs the installed lifecycle. Ubuntu also qualifies the
      # repeated clean build, relocated builder, and second distribution.
      - run: npm run test:e2e
        env:
          PISHIP_E2E_QUALIFICATION: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
          PISHIP_REQUIRE_SANDBOX: ${{ runner.os != 'Windows' && '1' || '0' }}

  # A scheduled failure opens (or comments on) one tracking issue, so a
  # nightly regression becomes a visible follow-up without blocking pull
  # requests. Manual and Release qualification runs report in the Actions UI
  # only.
  report:
    needs: portable
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Nightly Portable E2E is failing
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="The scheduled Portable E2E run failed on main: $RUN_URL"
          number="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
