name: Portable E2E
# Full three-target installed E2E is nightly and manual integration
# evidence, not a pull request gate (see AGENTS.md, CI evidence tiers).
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  # Called from Release qualification, github.workflow names the caller; the
  # literal prefix keeps this group apart from its sibling reusable workflows.
  group: portable-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  portable:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Every `piship build` and `piship release` runs a real `npm ci`; reuse
    # cached package metadata instead of revalidating it with the registry.
    env:
      npm_config_prefer_offline: "true"
    steps:
      # Windows runners are ephemeral VMs whose C: drive is slow for the many
      # small files npm writes. Skip Defender scanning and keep temp output and
      # the npm cache on the runner's work drive.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "npm_config_cache=$env:RUNNER_TEMP\npm-cache" >> $env:GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.x
          cache: npm
      - run: node -p "process.platform + '/' + process.arch + ' Node ' + process.version"
      # The OS sandbox tests need bubblewrap and unprivileged user
      # namespaces, which Ubuntu restricts through AppArmor by default. The
      # live secret-store scenarios need GNOME Keyring, a D-Bus session, and
      # secret-tool; without recommended packages this stays clear of the
      # desktop stack.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo apt-get install -y -qq --no-install-recommends gnome-keyring dbus dbus-x11 libsecret-tools
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --version
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code
      # The live secret-store scenarios use a keychain of their own on macOS:
      # created with a throwaway password that is generated here and never
      # printed, unlocked without an idle timeout, and made the job user's
      # only search-list entry and default keychain. It is deleted, and the
      # runner's list restored, after the E2E step, whatever its result.
      - name: Temporary keychain
        if: runner.os == 'macOS'
        timeout-minutes: 2
        run: |
          keychain="$RUNNER_TEMP/piship-e2e.keychain-db"
          security list-keychains -d user > "$RUNNER_TEMP/keychains-before"
          security default-keychain -d user > "$RUNNER_TEMP/default-keychain-before"
          password="$(head -c 32 /dev/urandom | base64)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security list-keychains -d user
      # Every target runs the installed lifecycle, and the managed secret
      # store scenarios on the live platform store (PISHIP_LIVE_SECRET_STORE).
      # Ubuntu also qualifies the repeated clean build, relocated builder,
      # and second distribution.
      - if: runner.os != 'Linux'
        timeout-minutes: 40
        run: npm run test:e2e
        env:
          PISHIP_E2E_QUALIFICATION: "0"
          PISHIP_REQUIRE_SANDBOX: ${{ runner.os != 'Windows' && '1' || '0' }}
          PISHIP_LIVE_SECRET_STORE: "1"
      # A Linux runner has no desktop session, so the E2E run gets a private
      # D-Bus session with GNOME Keyring on a fresh data directory, unlocked
      # with a throwaway password that only travels through a pipe, exactly
      # as the CI live-store step does. Only the daemon sees that directory.
      - if: runner.os == 'Linux'
        timeout-minutes: 40
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            keyring="$(mktemp -d)"
            head -c 32 /dev/urandom | base64 | XDG_DATA_HOME="$keyring" gnome-keyring-daemon --unlock --foreground --components=secrets > /dev/null &
            ready() {
              dbus-send --session --print-reply --dest=org.freedesktop.DBus /org/freedesktop/DBus org.freedesktop.DBus.NameHasOwner string:org.freedesktop.secrets 2> /dev/null | grep true > /dev/null &&
                dbus-send --session --print-reply --dest=org.freedesktop.secrets /org/freedesktop/secrets/collection/login org.freedesktop.DBus.Properties.Get string:org.freedesktop.Secret.Collection string:Locked 2> /dev/null | grep false > /dev/null
            }
            for _ in $(seq 100); do ready && break; sleep 0.1; done
            ready || { echo "GNOME Keyring did not unlock its login collection" >&2; exit 1; }
            npm run test:e2e
          '
        env:
          PISHIP_E2E_QUALIFICATION: "1"
          PISHIP_REQUIRE_SANDBOX: "1"
          PISHIP_LIVE_SECRET_STORE: "1"
      - name: Delete the temporary keychain
        if: always() && runner.os == 'macOS'
        timeout-minutes: 2
        run: |
          keychain="$RUNNER_TEMP/piship-e2e.keychain-db"
          if [ -s "$RUNNER_TEMP/keychains-before" ]; then
            xargs security list-keychains -d user -s < "$RUNNER_TEMP/keychains-before"
            xargs security default-keychain -d user -s < "$RUNNER_TEMP/default-keychain-before"
          fi
          if [ -e "$keychain" ]; then security delete-keychain "$keychain"; fi
          security list-keychains -d user
      # The scenarios delete their Credential Manager entries themselves;
      # this removes any that a failed or cancelled run left behind, and
      # fails when one cannot be removed.
      - name: Remove leftover test credentials
        if: always() && runner.os == 'Windows'
        timeout-minutes: 2
        shell: pwsh
        run: |
          function Leftovers { @(cmdkey /list | Select-String -Pattern 'target=(piship:piship:acmelive-\S+)' | ForEach-Object { $_.Matches[0].Groups[1].Value }) }
          $targets = Leftovers
          foreach ($target in $targets) {
            cmdkey "/delete:$target" | Out-Null
            if ($LASTEXITCODE -ne 0) { "cmdkey could not delete $target (exit $LASTEXITCODE)" }
          }
          $left = Leftovers
          "Removed $($targets.Count - $left.Count) of $($targets.Count) leftover test credential(s)"
          if ($left.Count) { Write-Error "Test credentials remain: $($left -join ', ')"; exit 1 }
          exit 0

  # A scheduled failure opens (or comments on) one tracking issue, so a
  # nightly regression becomes a visible follow-up without blocking pull
  # requests. Manual and Release qualification runs report in the Actions UI
  # only.
  report:
    needs: portable
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Nightly Portable E2E is failing
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="The scheduled Portable E2E run failed on main: $RUN_URL"
          number="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
