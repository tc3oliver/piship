name: Portable E2E
on:
  pull_request:
    paths:
      - 'packages/**'
      - 'tests/e2e/**'
      - 'tests/helpers/**'
      - 'examples/personal/**'
      - 'examples/demo-company/**'
      - 'scripts/**'
      - 'compatibility/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
      - 'tsconfig*.json'
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'tests/e2e/**'
      - 'tests/helpers/**'
      - 'examples/personal/**'
      - 'examples/demo-company/**'
      - 'scripts/**'
      - 'compatibility/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
      - 'tsconfig*.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  portable:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the slowest target for the installed lifecycle. Pull
        # requests run Ubuntu and macOS; pushes to main and manual runs
        # (workflow_dispatch) also cover Windows.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    steps:
      # Defender real-time scanning dominates npm installs on Windows runners,
      # which are ephemeral VMs.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.x
          cache: npm
      - run: node -p "process.platform + '/' + process.arch + ' Node ' + process.version"
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code
      # Every target runs the installed lifecycle. Ubuntu also qualifies the
      # repeated clean build, relocated builder, and second distribution.
      - run: npm run test:e2e
        env:
          PISHIP_E2E_QUALIFICATION: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
