name: Windows Containment E2E
# Native CLI forced-owner-kill regression; the regular CI unit shards only
# exercise the Job Object helper directly.
on:
  pull_request:
    paths:
      - "tests/e2e/background-tasks.test.ts"
      - "packages/pi/src/governed-tools.ts"
      - "packages/pi/src/task-tools.ts"
      - "packages/sandbox/src/process.ts"
      - "packages/sandbox/src/windows-job*"
      - ".github/workflows/windows-containment-e2e.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-containment:
    name: Windows CLI hard-kill E2E
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.x
          cache: npm
      - name: Use npm 11
        shell: bash
        run: |
          npm install -g npm@11.21.0 --prefix "$(node -p "require('path').dirname(process.execPath)")"
          node -e "const v = require('child_process').execSync('npm --version', { shell: true }).toString().trim(); if (!v.startsWith('11.')) process.exit(1);"
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code
      - name: Windows CLI forced-kill E2E
        timeout-minutes: 20
        run: node node_modules/vitest/vitest.mjs run --config vitest.config.ts tests/e2e/background-tasks.test.ts
        env:
          PISHIP_E2E_QUALIFICATION: "0"
          PISHIP_REQUIRE_SANDBOX: "0"
          PISHIP_REQUIRE_ISOLATOR: "0"
          PISHIP_LIVE_SECRET_STORE: "1"
