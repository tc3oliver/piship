name: Pi compatibility
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.x
          cache: npm
      - run: node -p "process.platform + '/' + process.arch + ' Node ' + process.version"
      - run: npm ci
      - run: npm run build
      - run: npm run test:compatibility
# TODO: Add a read-only latest Pi canary once it can report failures reliably.
# It must never change the pinned runtime dependency, commit, merge, or publish.
