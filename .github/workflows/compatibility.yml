name: Pi compatibility
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:compatibility
# TODO: Add a read-only latest Pi canary once it can report failures reliably.
# It must never change the production dependency, commit, merge, or publish.
