name: Task Grant Acceptance
on:
  push:
    branches: [feat/315-manifest-task-grants]
concurrency:
  group: task-grant-acceptance-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  headless:
    name: headless (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.x
          cache: npm
      - name: Use npm 11
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            npm install -g npm@11.21.0 --prefix "$(node -p "require('path').dirname(process.execPath)")"
          else
            npm install -g npm@11.21.0
          fi
          node -e "const v = require('child_process').execSync('npm --version', { shell: true }).toString().trim(); if (!v.startsWith('11.')) process.exit(1);"
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm run build
      - name: Headless workload grant E2E
        run: node node_modules/vitest/vitest.mjs run --config vitest.e2e.config.ts tests/e2e/headless.test.ts
        env:
          PISHIP_REQUIRE_SANDBOX: ${{ runner.os != 'Windows' && '1' || '0' }}
          PISHIP_REQUIRE_ISOLATOR: ${{ runner.os != 'Windows' && '1' || '0' }}
