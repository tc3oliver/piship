name: Secret store
# Real platform secret stores (Keychain, Credential Manager). Linux runners
# have no unlocked Secret Service session; its backend is covered by the
# command-runner tests in CI. Runs only when the credential package changes.
on:
  pull_request:
    paths:
      - 'packages/credentials/**'
      - 'packages/contracts/**'
      - '.github/workflows/secret-store.yml'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'packages/credentials/**'
      - 'packages/contracts/**'
      - '.github/workflows/secret-store.yml'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  secret-store:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      # Defender real-time scanning dominates npm installs on Windows runners,
      # which are ephemeral VMs.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run packages/credentials/src/platform-store.test.ts
        env:
          PISHIP_LIVE_SECRET_STORE: "1"
