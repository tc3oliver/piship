name: Windows benchmark
# Manual measurement only. These throwaway archives are never release artifacts.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Run one suite (install-authoring, sweep-bundled, sweep-unbundled, cmd-launch, store); empty runs all"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  benchmark:
    name: benchmark (${{ matrix.suite }})
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.suite == '' && '["install-authoring","sweep-bundled","sweep-unbundled","cmd-launch","store"]' || format('["{0}"]', inputs.suite)) }}
    env:
      npm_config_prefer_offline: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.x
          cache: npm
      - name: Enable Defender and remove runner exclusions
        shell: pwsh
        run: |
          $preferences = Get-MpPreference
          foreach ($path in $preferences.ExclusionPath) { Remove-MpPreference -ExclusionPath $path }
          foreach ($process in $preferences.ExclusionProcess) { Remove-MpPreference -ExclusionProcess $process }
          foreach ($extension in $preferences.ExclusionExtension) { Remove-MpPreference -ExclusionExtension $extension }
          Set-MpPreference -DisableRealtimeMonitoring $false
          # Real-time protection starts asynchronously on the runner image; wait for it.
          $deadline = (Get-Date).AddSeconds(120)
          do {
            $status = Get-MpComputerStatus
            if ($status.RealTimeProtectionEnabled) { break }
            Start-Sleep -Seconds 3
            Set-MpPreference -DisableRealtimeMonitoring $false
          } while ((Get-Date) -lt $deadline)
          $preferences = Get-MpPreference
          if (-not $status.RealTimeProtectionEnabled) { throw "Defender real-time protection is disabled" }
          if ($preferences.ExclusionPath.Count -or $preferences.ExclusionProcess.Count -or $preferences.ExclusionExtension.Count) { throw "Defender exclusions remain" }
          New-Item -ItemType Directory -Force benchmark-evidence | Out-Null
          @{
            status = $status
            preferences = $preferences
          } | ConvertTo-Json -Depth 8 | Set-Content benchmark-evidence/defender.json
          "PISHIP_BENCH_DEFENDER=enabled; path/process/extension exclusions removed" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "npm_config_cache=$env:RUNNER_TEMP\npm-cache" >> $env:GITHUB_ENV
      - name: Use npm 11
        shell: bash
        run: |
          npm install -g npm@11.21.0 --prefix "$(node -p "require('path').dirname(process.execPath)")"
          node -e "const v = require('child_process').execSync('npm --version', { shell: true }).toString().trim(); console.log('spawned npm ' + v); if (!v.startsWith('11.')) process.exit(1);"
      - run: npm ci
      - run: npm run build
      - name: Measure install, update, launch and cold/warm portable authoring
        if: matrix.suite == 'install-authoring'
        shell: pwsh
        run: |
          node scripts/benchmark-install.mjs --root . --out "$env:RUNNER_TEMP/piship-authoring-benchmark" --bundle --authoring 2>&1 | Tee-Object -FilePath benchmark-evidence/benchmark.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$env:RUNNER_TEMP/piship-authoring-benchmark/report.json" benchmark-evidence/report.json
      - name: Sweep extraction and copy concurrency and buffer thresholds
        if: matrix.suite == 'sweep-bundled'
        shell: pwsh
        run: |
          node scripts/benchmark-concurrency.mjs --out "$env:RUNNER_TEMP/piship-concurrency" --reps 5 2>&1 | Tee-Object -FilePath benchmark-evidence/concurrency.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$env:RUNNER_TEMP/piship-concurrency/report.json" benchmark-evidence/concurrency-report.json
          Copy-Item "$env:RUNNER_TEMP/piship-concurrency/report.md" benchmark-evidence/concurrency-report.md
      - name: Sweep extraction and copy concurrency on the unbundled layout (thousands of files)
        if: matrix.suite == 'sweep-unbundled'
        shell: pwsh
        run: |
          # Thousands of files make every cell slow: sweep concurrency at 1 MiB, then the buffer at 8 writers.
          node scripts/benchmark-concurrency.mjs --out "$env:RUNNER_TEMP/piship-concurrency-unbundled" --reps 2 --bundle false --concurrency 4,8,16,32 --buffer-kib 1024 2>&1 | Tee-Object -FilePath benchmark-evidence/concurrency-unbundled.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$env:RUNNER_TEMP/piship-concurrency-unbundled/report.json" benchmark-evidence/concurrency-unbundled-report.json
          Copy-Item "$env:RUNNER_TEMP/piship-concurrency-unbundled/report.md" benchmark-evidence/concurrency-unbundled-report.md
          node scripts/benchmark-concurrency.mjs --out "$env:RUNNER_TEMP/piship-buffer-unbundled" --reps 2 --bundle false --concurrency 8 --buffer-kib 256,1024,4096 2>&1 | Tee-Object -FilePath benchmark-evidence/buffer-unbundled.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$env:RUNNER_TEMP/piship-buffer-unbundled/report.json" benchmark-evidence/buffer-unbundled-report.json
          Copy-Item "$env:RUNNER_TEMP/piship-buffer-unbundled/report.md" benchmark-evidence/buffer-unbundled-report.md
      - name: Measure the .cmd shim against a direct launcher start
        if: matrix.suite == 'cmd-launch'
        shell: pwsh
        run: |
          node scripts/benchmark-cmd-launch.mjs --root . --out "$env:RUNNER_TEMP/piship-cmd-launch" --reps 15 2>&1 | Tee-Object -FilePath benchmark-evidence/cmd-launch.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$env:RUNNER_TEMP/piship-cmd-launch/report.json" benchmark-evidence/cmd-launch-report.json
          Copy-Item "$env:RUNNER_TEMP/piship-cmd-launch/summary.md" benchmark-evidence/cmd-launch-summary.md
      - name: Measure shared store placement (copy, clone, hardlink; fresh, warm, update, remove)
        if: matrix.suite == 'store'
        shell: pwsh
        run: |
          node scripts/benchmark-store.mjs --out "$env:RUNNER_TEMP/piship-store" --files 3000 --reps 7 --verify-modes content,size 2>&1 | Tee-Object -FilePath benchmark-evidence/store.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$env:RUNNER_TEMP/piship-store/report.json" benchmark-evidence/store-report.json
          Copy-Item "$env:RUNNER_TEMP/piship-store/summary.md" benchmark-evidence/store-summary.md
      - name: Measure shared store placement with the store on another volume
        if: matrix.suite == 'store'
        shell: pwsh
        run: |
          if (-not (Test-Path 'D:\')) { "No second volume on this runner; skipped." | Tee-Object -FilePath benchmark-evidence/store-volume.log; exit 0 }
          node scripts/benchmark-store.mjs --out "$env:RUNNER_TEMP/piship-store-volume" --store-dir 'D:\piship-store-bench' --files 3000 --reps 3 2>&1 | Tee-Object -FilePath benchmark-evidence/store-volume.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$env:RUNNER_TEMP/piship-store-volume/report.json" benchmark-evidence/store-volume-report.json
      - name: Check the store against its budgets (a result, not a gate)
        if: matrix.suite == 'store'
        # A store that exceeds a budget is the evidence that DEFAULT_STORE_MODE stays off.
        continue-on-error: true
        shell: pwsh
        run: |
          foreach ($mode in 'copy', 'clone', 'hardlink') {
            "== $mode ==" | Tee-Object -FilePath benchmark-evidence/store-budgets.log -Append
            node scripts/store-budgets.mjs --store-report benchmark-evidence/store-report.json --mode $mode 2>&1 | Tee-Object -FilePath benchmark-evidence/store-budgets.log -Append
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: windows-benchmark-${{ matrix.suite }}-${{ github.sha }}
          path: benchmark-evidence/
          if-no-files-found: error
