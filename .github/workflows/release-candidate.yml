name: Release candidate
# Builds, verifies, and attests the release archives of the managed demo
# (acmecode) and the personal example (mypi).
# Output stays in workflow artifacts: nothing is published or released here.
# Release qualification (release-qualification.yml) calls it on the exact
# candidate HEAD after CI, CodeQL, Portable E2E, and Reference E2E pass; it
# can also be dispatched alone. It is not triggered by pull requests or main
# pushes (see AGENTS.md, CI evidence tiers).
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  # Called from Release qualification, github.workflow names the caller; the
  # literal prefix keeps this group apart from its sibling reusable workflows.
  group: release-candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Every target is built twice, on two separate runners, each from a fresh
  # checkout and `npm ci`, with the same SOURCE_DATE_EPOCH (the commit time).
  # Only the `first` build is attested, verified, and installed downstream;
  # the `second` build exists to prove the first is reproducible.
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x64, darwin-arm64, win32-x64]
        build: [first, second]
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: darwin-arm64
            os: macos-latest
          - target: win32-x64
            os: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # Windows runners are ephemeral VMs whose C: drive is slow for the many
      # small files npm and the release archives write. Every Windows job
      # skips Defender scanning and keeps temp output and the npm cache on the
      # runner's work drive.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "npm_config_cache=$env:RUNNER_TEMP\npm-cache" >> $env:GITHUB_ENV
          "npm_config_prefer_offline=true" >> $env:GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.x
          cache: npm
      - run: node -p "process.platform + '-' + process.arch + ' Node ' + process.version"
      - run: test "$(node -p "process.platform + '-' + process.arch")" = "${{ matrix.target }}"
      - run: npm ci
      - run: npm run build
      # The committed, reviewed piship.lock is used as is: `piship lock` is not
      # run, so the release `lock` gate proves the committed lock is current.
      - name: Copy the committed demo distribution
        if: runner.os != 'Windows'
        run: |
          test -f examples/demo-company/piship.lock
          node -e 'require("node:fs").cpSync("examples/demo-company", require("node:path").join(process.env.RUNNER_TEMP, "demo"), { recursive: true })'
      # Windows has no sandbox adapter, so the demo (sandbox.required: true)
      # is refused there by the release sandbox gate. The Windows candidate is
      # therefore a variant: it is built from a patched copy that makes the
      # sandbox optional, and its lock is generated here in CI rather than
      # reviewed and committed.
      - name: Prepare the Windows variant (patched copy, lock generated in CI)
        if: runner.os == 'Windows'
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const demo = path.join(process.env.RUNNER_TEMP, "demo");
            fs.cpSync("examples/demo-company", demo, { recursive: true });
            const file = path.join(demo, "piship.yaml");
            const source = fs.readFileSync(file, "utf8");
            const patched = source.replace("  required: true\n  filesystem:", "  required: false\n  filesystem:");
            if (patched === source) throw new Error("sandbox setting not found");
            fs.writeFileSync(file, patched);
          '
          node packages/cli/dist/bin.js lock "$RUNNER_TEMP/demo/piship.yaml"
      # The personal example needs no sandbox, so every target uses its
      # committed, reviewed lock unchanged.
      - name: Copy the committed personal distribution
        run: |
          test -f examples/personal/piship.lock
          node -e 'require("node:fs").cpSync("examples/personal", require("node:path").join(process.env.RUNNER_TEMP, "personal"), { recursive: true })'
      - name: Build the releases
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          mkdir -p "$RUNNER_TEMP/upload"
          for pair in demo:acmecode personal:mypi; do
            dir="${pair%%:*}" id="${pair##*:}"
            node packages/cli/dist/bin.js release "$RUNNER_TEMP/$dir/piship.yaml" --out "$RUNNER_TEMP/out" --channel candidate
            name="$id-1.0.0-${{ matrix.target }}"
            cp "$RUNNER_TEMP/out/releases/$name.tar.gz" "$RUNNER_TEMP/out/releases/$name.tar.gz.sha256" "$RUNNER_TEMP/upload/"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.target }}-${{ matrix.build }}
          path: ${{ runner.temp }}/upload/
          if-no-files-found: error
          retention-days: 14

  # The trusted PiShip CLI for the consumer jobs, compiled once from this
  # commit on a runner that builds no release. It is plain JavaScript (the Pi
  # runtime is not part of it), so one pack serves every target. The release
  # builders above never use it: each still compiles its own PiShip from a
  # fresh checkout and `npm ci`.
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/pack-cli.mjs "$RUNNER_TEMP/piship-cli"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: piship-cli
          path: ${{ runner.temp }}/piship-cli/
          if-no-files-found: error
          retention-days: 14

  # Compares the two independent builds of each target. `piship
  # reproducibility` verifies both and exits nonzero unless every payload
  # file is equal; the report also records whether the archives are identical.
  # It only consumes artifacts: the trusted CLI and the two builds.
  reproducibility:
    needs: [build, cli]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        distribution: [acmecode, mypi]
        target: [linux-x64, darwin-arm64, win32-x64]
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64
    defaults:
      run:
        shell: bash
    env:
      NAME: ${{ matrix.distribution }}-1.0.0-${{ matrix.target }}
    steps:
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "npm_config_cache=$env:RUNNER_TEMP\npm-cache" >> $env:GITHUB_ENV
          "npm_config_prefer_offline=true" >> $env:GITHUB_ENV
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.x
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: piship-cli
          path: ${{ runner.temp }}/piship-cli
      - run: echo "PISHIP_CLI=$RUNNER_TEMP/piship-cli/node_modules/@piship/cli/dist/bin.js" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-${{ matrix.target }}-first
          path: ${{ runner.temp }}/first
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-${{ matrix.target }}-second
          path: ${{ runner.temp }}/second
      - name: Compare the two builds
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          node "$PISHIP_CLI" reproducibility "$RUNNER_TEMP/first/$NAME.tar.gz" "$RUNNER_TEMP/second/$NAME.tar.gz" \
            --out "$RUNNER_TEMP/report/reproducibility-$NAME.json"
          cat "$RUNNER_TEMP/report/reproducibility-$NAME.json"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reproducibility-${{ matrix.distribution }}-${{ matrix.target }}
          path: ${{ runner.temp }}/report/
          if-no-files-found: ignore
          retention-days: 14

  # Keyless build provenance bound to this workflow's identity and the ref it
  # ran for. Only the `first` build of each target is attested.
  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*-first
          path: releases
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: releases/*.tar.gz

  # A fresh runner per target that never built the archive: verify the
  # checksum, contents, and provenance with the trusted CLI, and prove
  # tampering is caught. Each tampering case fails at the earliest layer that
  # can prove it; only the payload edit needs the full payload walk.
  verify:
    needs: [build, attest, cli]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.cli.result == 'success' && needs.attest.result != 'failure' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        distribution: [acmecode, mypi]
        target: [linux-x64, darwin-arm64, win32-x64]
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64
    defaults:
      run:
        shell: bash
    env:
      NAME: ${{ matrix.distribution }}-1.0.0-${{ matrix.target }}
      GH_TOKEN: ${{ github.token }}
      ATTESTED: ${{ needs.attest.result == 'success' }}
    steps:
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "npm_config_cache=$env:RUNNER_TEMP\npm-cache" >> $env:GITHUB_ENV
          "npm_config_prefer_offline=true" >> $env:GITHUB_ENV
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.x
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: piship-cli
          path: ${{ runner.temp }}/piship-cli
      - run: echo "PISHIP_CLI=$RUNNER_TEMP/piship-cli/node_modules/@piship/cli/dist/bin.js" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-${{ matrix.target }}-first
          path: ${{ runner.temp }}/candidate
      - name: Verify the release
        working-directory: ${{ runner.temp }}/candidate
        run: |
          node "$PISHIP_CLI" verify-release "$NAME.tar.gz" --sha256 "$(cut -d ' ' -f 1 "$NAME.tar.gz.sha256")"
      # The attestation records the ref the run was dispatched for, normally
      # refs/heads/main.
      - name: Verify the provenance
        if: env.ATTESTED == 'true'
        working-directory: ${{ runner.temp }}/candidate
        run: |
          gh attestation verify "$NAME.tar.gz" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-candidate.yml" \
            --source-ref "$GITHUB_REF"
      # Archive-level cases: a corrupted archive fails while it is read, and a
      # wrong expected digest fails before anything is extracted.
      - name: Reject a tampered archive
        working-directory: ${{ runner.temp }}/candidate
        run: |
          node -e '
            const fs = require("node:fs");
            const bytes = fs.readFileSync(process.argv[1]);
            bytes[bytes.length - 100] ^= 0xff;
            fs.writeFileSync(process.argv[2], bytes);
          ' "$NAME.tar.gz" tampered.tar.gz
          if node "$PISHIP_CLI" verify-release tampered.tar.gz; then
            echo "verify-release accepted a tampered archive" >&2; exit 1
          fi
          if node "$PISHIP_CLI" verify-release "$NAME.tar.gz" --sha256 "$(printf '0%.0s' $(seq 64))"; then
            echo "verify-release accepted a wrong expected digest" >&2; exit 1
          fi
          if [ "$ATTESTED" = true ] && gh attestation verify tampered.tar.gz --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-candidate.yml" \
            --source-ref "$GITHUB_REF"; then
            echo "gh attestation verify accepted a tampered archive" >&2; exit 1
          fi
      # One extraction, verified untouched first. Each case then edits one
      # file, requires verify-release on the directory to fail with
      # INTEGRITY_FAILED at the expected layer, and restores the exact bytes.
      # Metadata, SBOM, and checksums edits fail at the release checksums;
      # only the payload edit reaches the payload inventory walk.
      # Relative paths keep tar working under Git Bash on Windows.
      - name: Reject tampered release files
        working-directory: ${{ runner.temp }}/candidate
        run: |
          mkdir extracted
          tar -xzf "$NAME.tar.gz" -C extracted
          dir="extracted/$NAME"
          node "$PISHIP_CLI" verify-release "$dir"
          expect_rejected() {
            local file="$dir/$1" label="$2" layer="$3" edit="$4"
            test -f "$file" || { echo "missing $file" >&2; exit 1; }
            cp "$file" pristine
            node -e "$edit" "$file"
            if node "$PISHIP_CLI" verify-release "$dir" 2> rejected.err; then
              echo "verify-release accepted $label" >&2; exit 1
            fi
            cat rejected.err >&2
            grep -q INTEGRITY_FAILED rejected.err || { echo "verify-release did not report INTEGRITY_FAILED for $label" >&2; exit 1; }
            grep -qF "$layer" rejected.err || { echo "verify-release did not reject $label with: $layer" >&2; exit 1; }
            cp pristine "$file"
            cmp pristine "$file"
          }
          append='require("node:fs").appendFileSync(process.argv[1], " ");'
          expect_rejected release.json "a modified release.json" "Checksum mismatch for release.json" "$append"
          expect_rejected sbom.spdx.json "a modified SBOM" "Checksum mismatch for sbom.spdx.json" "$append"
          expect_rejected checksums.txt "a modified checksums.txt" "Checksum mismatch" '
            const fs = require("node:fs");
            const file = process.argv[1];
            const lines = fs.readFileSync(file, "utf8").split("\n");
            if (!/^[0-9a-f]{64} /.test(lines[0])) throw new Error("unexpected checksums.txt line");
            lines[0] = (lines[0][0] === "0" ? "1" : "0") + lines[0].slice(1);
            fs.writeFileSync(file, lines.join("\n"));
          '
          expect_rejected payload/package.json "a modified payload file" "payload integrity mismatch" "$append"

  # A fresh runner per target installs the first build with the install
  # script shipped inside it, which verifies the release itself. It needs no
  # PiShip CLI, so it runs alongside verification. The personal example then
  # runs the installed offline `--smoke` and `doctor`; the managed demo needs
  # a sign-in (fixtures, a secret store, and on Linux bubblewrap) for those,
  # which the Portable E2E covers, so it checks the version only.
  install:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        distribution: [acmecode, mypi]
        target: [linux-x64, darwin-arm64, win32-x64]
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64
    defaults:
      run:
        shell: bash
    env:
      NAME: ${{ matrix.distribution }}-1.0.0-${{ matrix.target }}
      DIST: ${{ matrix.distribution }}
      DIST_NAME: ${{ matrix.distribution == 'mypi' && 'MyPi' || 'AcmeCode' }}
    steps:
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "npm_config_cache=$env:RUNNER_TEMP\npm-cache" >> $env:GITHUB_ENV
          "npm_config_prefer_offline=true" >> $env:GITHUB_ENV
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.x
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-${{ matrix.target }}-first
          path: ${{ runner.temp }}/candidate
      - name: Install with the shipped script
        if: runner.os != 'Windows'
        working-directory: ${{ runner.temp }}/candidate
        run: |
          tar -xzf "$NAME.tar.gz"
          export PISHIP_INSTALL_HOME="$RUNNER_TEMP/install" PISHIP_BIN_HOME="$RUNNER_TEMP/bin"
          sh "$NAME/install.sh"
          "$RUNNER_TEMP/bin/$DIST" version | tee version.txt
          grep -q "$DIST_NAME 1.0.0" version.txt
      - name: Install with the shipped script
        if: runner.os == 'Windows'
        working-directory: ${{ runner.temp }}/candidate
        shell: pwsh
        run: |
          tar -xzf "$env:NAME.tar.gz"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PISHIP_INSTALL_HOME = "$env:RUNNER_TEMP\install"
          $env:PISHIP_BIN_HOME = "$env:RUNNER_TEMP\bin"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:NAME\install.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = & "$env:RUNNER_TEMP\bin\$env:DIST.cmd" version
          $version
          if (-not ($version -match "$env:DIST_NAME 1\.0\.0")) { exit 1 }
      # Offline checks on the installed personal release: Pi startup, the
      # declared resources and extension, the notes MCP server, session
      # resume, and the diagnostics. No model request and no network.
      - name: Smoke and doctor the installed personal release
        if: matrix.distribution == 'mypi' && runner.os != 'Windows'
        run: |
          "$RUNNER_TEMP/bin/mypi" --smoke
          "$RUNNER_TEMP/bin/mypi" doctor
      - name: Smoke and doctor the installed personal release
        if: matrix.distribution == 'mypi' && runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\bin\mypi.cmd" --smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\bin\mypi.cmd" doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
