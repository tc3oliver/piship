name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  # Called from Release qualification, github.workflow names the caller; the
  # literal prefix keeps this group apart from its sibling reusable workflows.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Windows runners are ephemeral VMs whose C: drive is slow for the many
      # small files npm writes. Skip Defender scanning and keep temp output and
      # the npm cache on the runner's work drive.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "npm_config_cache=$env:RUNNER_TEMP\npm-cache" >> $env:GITHUB_ENV
          "npm_config_prefer_offline=true" >> $env:GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.x
          cache: npm
      # npm 10, which Node 22 bundles, runs a git dependency's prepare script
      # while resolving, so `piship lock` refuses to lock Pi packages without
      # npm 11, and the tests that lock them fail under CI without it.
      # On Windows `npm install -g` writes to a separate global prefix and the
      # npm.cmd beside node.exe still wins for spawned processes, so npm 11 is
      # installed over the bundled npm there. The check spawns npm as the
      # tests do.
      - name: Use npm 11
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            npm install -g npm@11.21.0 --prefix "$(node -p "require('path').dirname(process.execPath)")"
          else
            npm install -g npm@11.21.0
          fi
          node -e "const v = require('child_process').execSync('npm --version', { shell: true }).toString().trim(); console.log('spawned npm ' + v); if (!v.startsWith('11.')) process.exit(1);"
      - run: node -p "process.platform + '/' + process.arch + ' Node ' + process.version"
      # The OS sandbox tests need bubblewrap and unprivileged user
      # namespaces, which Ubuntu restricts through AppArmor by default. The live
      # secret-store test needs GNOME Keyring, a D-Bus session, and secret-tool;
      # without recommended packages this stays clear of the desktop stack.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends bubblewrap gnome-keyring dbus dbus-x11 libsecret-tools
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --version
      - run: npm ci
      # Formatting, lint, types, and boundaries do not depend on the OS.
      - if: matrix.os == 'ubuntu-latest'
        run: npm run format:check
      - if: matrix.os == 'ubuntu-latest'
        run: npm run lint
      - if: matrix.os == 'ubuntu-latest'
        run: npm run typecheck
      - if: matrix.os == 'ubuntu-latest'
        run: npm run check:boundaries
      - run: npm run build
      # Linux and macOS must enforce the sandbox: a missing adapter fails
      # the sandbox tests instead of skipping them.
      - run: npm test
        env:
          PISHIP_REQUIRE_SANDBOX: ${{ runner.os != 'Windows' && '1' || '0' }}
          PISHIP_REQUIRE_ISOLATOR: ${{ runner.os != 'Windows' && '1' || '0' }}
      - run: npm run test:compatibility
      # Real platform secret stores: Keychain, Credential Manager, and the
      # Linux Secret Service. A Linux runner has no desktop session, so its
      # test runs on a private D-Bus session with GNOME Keyring in a fresh data
      # directory (an existing keyring would refuse the new password). The
      # keyring is unlocked with a throwaway password that is generated here
      # and only travels through a pipe. The daemon runs in the foreground and
      # the test waits until its login collection is unlocked: started as a
      # daemon, its first secret-tool call failed about half the time.
      - if: runner.os != 'Linux'
        run: npx vitest run packages/credentials/src/platform-store.test.ts
        env:
          PISHIP_LIVE_SECRET_STORE: "1"
      - if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            XDG_DATA_HOME="$(mktemp -d)"
            export XDG_DATA_HOME
            head -c 32 /dev/urandom | base64 | gnome-keyring-daemon --unlock --foreground --components=secrets > /dev/null &
            ready() {
              dbus-send --session --print-reply --dest=org.freedesktop.DBus /org/freedesktop/DBus org.freedesktop.DBus.NameHasOwner string:org.freedesktop.secrets 2> /dev/null | grep true > /dev/null &&
                dbus-send --session --print-reply --dest=org.freedesktop.secrets /org/freedesktop/secrets/collection/login org.freedesktop.DBus.Properties.Get string:org.freedesktop.Secret.Collection string:Locked 2> /dev/null | grep false > /dev/null
            }
            for _ in $(seq 100); do ready && break; sleep 0.1; done
            ready || { echo "GNOME Keyring did not unlock its login collection" >&2; exit 1; }
            npx vitest run packages/credentials/src/platform-store.test.ts
          '
        env:
          PISHIP_LIVE_SECRET_STORE: "1"
