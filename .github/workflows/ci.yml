name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  # Called from Release qualification, github.workflow names the caller; the
  # literal prefix keeps this group apart from its sibling reusable workflows.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Windows runners are ephemeral VMs whose C: drive is slow for the many
      # small files npm writes. Skip Defender scanning and keep temp output and
      # the npm cache on the runner's work drive.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "npm_config_cache=$env:RUNNER_TEMP\npm-cache" >> $env:GITHUB_ENV
          "npm_config_prefer_offline=true" >> $env:GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.x
          cache: npm
      - run: node -p "process.platform + '/' + process.arch + ' Node ' + process.version"
      # The OS sandbox tests need bubblewrap and unprivileged user
      # namespaces, which Ubuntu restricts through AppArmor by default.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --version
      - run: npm ci
      # Formatting, lint, types, and boundaries do not depend on the OS.
      - if: matrix.os == 'ubuntu-latest'
        run: npm run format:check
      - if: matrix.os == 'ubuntu-latest'
        run: npm run lint
      - if: matrix.os == 'ubuntu-latest'
        run: npm run typecheck
      - if: matrix.os == 'ubuntu-latest'
        run: npm run check:boundaries
      - run: npm run build
      # Linux and macOS must enforce the sandbox: a missing adapter fails
      # the sandbox tests instead of skipping them.
      - run: npm test
        env:
          PISHIP_REQUIRE_SANDBOX: ${{ runner.os != 'Windows' && '1' || '0' }}
      - run: npm run test:compatibility
      # Real platform secret stores (Keychain, Credential Manager). Linux
      # runners have no unlocked Secret Service session; its backend is
      # covered by the command-runner tests above.
      - if: runner.os != 'Linux'
        run: npx vitest run packages/credentials/src/platform-store.test.ts
        env:
          PISHIP_LIVE_SECRET_STORE: "1"
