version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      routine-npm:
        patterns: ["*"]
        # undici is also pinned in the root package.json overrides, which
        # Dependabot does not edit; alone, its pull request is the only one
        # needing that hand edit (CONTRIBUTING.md, Dependency updates).
        exclude-patterns: ["@earendil-works/pi-*", "@earendil-works/chord", "undici"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@earendil-works/pi-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "@earendil-works/chord"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      routine-actions:
        patterns: ["*"]
