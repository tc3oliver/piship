name: Bug report
description: Report a reproducible PiShip defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Never include API keys, access tokens, credentials, company secrets, proprietary source code, or sensitive logs. Report vulnerabilities privately using SECURITY.md."
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: "Describe the actual and expected behavior."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: "A small, sanitized reproduction is most useful."
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions and operating system
      description: "PiShip commit/version, Pi version, Node version, OS, and distribution mode if relevant."
      placeholder: "PiShip commit, Pi 1.1.0, Node 22.19, macOS, personal"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or context
      description: "Optional; remove credentials and sensitive content."
