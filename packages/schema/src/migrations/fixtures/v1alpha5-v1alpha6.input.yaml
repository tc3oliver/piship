schema: piship/v1alpha5
# A managed distribution with model rules and MCP tool filters.
app:
  id: acmecode
  name: AcmeCode
  command: acmecode
  version: 1.0.0
runtime:
  pi: "1.0.0"
deployment:
  mode: managed
identity:
  mode: oidc
  oidc:
    issuer: https://login.acme.example
    clientId: acmecode
    redirectUri: http://127.0.0.1:8765/callback
credential:
  provider: http-broker
  broker: { endpoint: https://broker.acme.example/token }
inference:
  provider: openai-compatible
  baseUrl: https://gateway.acme.example/v1
models:
  default: acme/coder
  allowed: [acme/coder]
  catalog:
    acme/coder: { name: Acme Coder, contextWindow: 128000, maxOutputTokens: 8192 }
policy:
  defaults:
    # every gateway model
    - id: distribution.models
      action: model.use
      resource: "acmecode/**"
      effect: allow
  enforced:
    - id: no.web
      action: web.request
      effect: deny
mcp:
  mode: allowlist
  servers:
    docs:
      transport: stdio
      module: ./mcp/docs.mjs
      tools:
        allow: [search, get_document]
        deny: [delete_document]
    issues:
      transport: stdio
      module: ./mcp/issues.mjs
      tools:
        deny: [close_issue]
    notes:
      transport: stdio
      module: ./mcp/notes.mjs
updates:
  channel: stable
  channels: [stable]
