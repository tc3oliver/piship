schema: piship/v1alpha5

# The AcmeCode reference distribution (../piship.yaml) with its commands run in
# the organization's container sandbox service (README.md) instead of the
# native OS sandbox: a custom adapter, the sandbox API key each user stores
# with `<command> sandbox login`, and one more runtime variable. Every other
# section is the reference manifest's, unchanged, and a test keeps it so. It
# is the same distribution (same ID, command, and state) built differently:
# install this build or the other, not both.
app:
  # Its own ID and command, so its state, its secret-store entries
  # (piship:<id>:*), and its launcher never meet those of an installed
  # `acmecode` such as the demo company's.
  id: acmecode-reference
  name: AcmeCode
  command: acmecode-reference
  version: 1.0.0
  banner: AcmeCode enterprise reference distribution (fictional)

runtime:
  pi: "1.0.0"

deployment:
  mode: managed

# Non-secret endpoints resolved from the launch environment at runtime, so the
# lock is the same whatever ports the stack was started on. The README lists
# the values for a stack started with the default `.env`.
variables:
  - ACMECODE_OIDC_ISSUER
  - ACMECODE_CREDENTIAL_BROKER_URL
  - ACMECODE_CREDENTIAL_REVOKE_URL
  - ACMECODE_LLM_GATEWAY_URL
  - ACMECODE_UPDATE_SOURCE
  - ACMECODE_SANDBOX_URL

identity:
  mode: oidc
  oidc:
    issuer: ${ACMECODE_OIDC_ISSUER}
    # The public client of the reference realm: no secret, PKCE S256 only.
    clientId: acmecode
    flow: authorization_code_pkce
    scopes: [openid, profile, email]
    # The realm registers this port-less loopback URI, which Keycloak matches
    # for any loopback port; PiShip listens on an ephemeral one.
    redirectUri: http://127.0.0.1/callback

credential:
  provider: http-broker
  broker:
    endpoint: ${ACMECODE_CREDENTIAL_BROKER_URL}
    revokeEndpoint: ${ACMECODE_CREDENTIAL_REVOKE_URL}
  storage:
    provider: system
  refresh:
    beforeExpiry: 5m

inference:
  provider: openai-compatible
  baseUrl: ${ACMECODE_LLM_GATEWAY_URL}
  api: openai-completions
  liveCatalog: true

# The upper bound. The broker narrows it per user by Keycloak group:
# `engineering` (alice) gets both models, `support` (bob) only acme/coder. The
# IDs are LiteLLM's model_name values.
models:
  default: acme/coder
  allowed:
    - acme/coder
    - acme/general
  catalog:
    acme/coder:
      name: Acme Coder
      contextWindow: 128000
      maxOutputTokens: 8192
      tools: true
      policyTags: [general, code]
    acme/general:
      name: Acme General
      contextWindow: 64000
      maxOutputTokens: 4096
      tools: true
      policyTags: [general]

config:
  enforced:
    theme: dark
  defaults:
    thinkingLevel: "off"
  userOverridable: [model, thinkingLevel]

network:
  proxy:
    inheritEnvironment: true
  publicFallback: deny
  privateOnly: true

resources:
  instructions:
    company: [./resources/AGENTS.md]
  skills:
    company: [./resources/skills]
  extensions:
    builtin: [piship-ask-user, piship-workflow]

capabilities:
  permissions:
    enabled: true
    provider: { id: builtin/permissions }
  workflow:
    enabled: true
    provider: { id: builtin/workflow }
    settings:
      defaultMode: plan
      planPrompt: Plan mode. Investigate and propose a plan; do not change files or run commands.
      buildPrompt: Build mode. Implement the approved plan with the smallest safe change.

# Fictional policy, the demo company's without its handbook MCP rules. Headless
# runs have no approval channel, so every `ask` below resolves to deny there.
policy:
  id: acme-engineering
  version: 1
  default: ask
  projectTrust:
    company:
      match:
        - remote: "git.acme.example/**"
          path: "/srv/src/**"
  enforced:
    - id: acme.secrets.read
      action: filesystem.read
      resource: "~/.ssh/**"
      effect: deny
      reason: Credentials stay outside the agent
  defaults:
    - id: acme.models
      action: model.use
      resource: "acmecode-reference/**"
      effect: allow
    - id: acme.skills
      action: skill.load
      resource: "**"
      effect: allow
    - id: acme.instructions
      action: instruction.load
      resource: "**"
      effect: allow
    - id: acme.extensions
      action: extension.load
      resource: "**"
      effect: allow
    - id: acme.workspace.read
      action: filesystem.read
      resource: "workspace/**"
      effect: allow
    - id: acme.workspace.write
      action: filesystem.write
      resource: "workspace/**"
      effect: ask
    - id: acme.shell
      action: shell.execute
      resource: "**"
      effect: ask
    - id: acme.tools
      action: tool.execute
      resource: "*"
      effect: allow

sandbox:
  required: true
  provider: custom
  # Packaged and locked like any resource; one file that imports only the SDK.
  adapter: ./acme-container-sandbox.mjs
  # 127.0.0.1 is allowed by the network policy because the stack's own
  # endpoints are on it; a service on another host is added to
  # network.allowHosts.
  endpoint: ${ACMECODE_SANDBOX_URL}
  # The API key the organization issued to the user, stored by `<command>
  # sandbox login`. PiShip binds it to the signed-in user and to the origin of
  # the endpoint, and never writes it to a file that is tracked or locked.
  credential: stored
  filesystem:
    read:
      # Credential stores an agent has no reason to read. A declared list
      # replaces PiShip's default list rather than adding to it, so this one
      # restates every default (the first ten) before adding its own. Extend
      # it with your organization's own (cloud CLIs, package registries, VPN
      # profiles).
      deny:
        - ~/.ssh
        - ~/.aws
        - ~/.gnupg
        - ~/.config/gcloud
        - ~/.azure
        - ~/.kube
        - ~/.docker
        - ~/.netrc
        - ~/.npmrc
        - ~/.pi
        - ~/.git-credentials
        - ~/.config/gh
        - ~/.local/share/keyrings
        - ~/Library/Keychains
    write:
      allow: [workspace, tmp]
  network:
    mode: deny

audit:
  enabled: true
  sinks:
    - id: local
      type: file
      required: false

# Signed release channels, as in the demo: no release key is pinned, so a
# distribution owner adds their own (piship keygen) before any update verifies.
updates:
  channel: stable
  channels: [stable, candidate]
  source: ${ACMECODE_UPDATE_SOURCE}
  rollback: true

# As in the reference manifest: the stack runs in Linux containers, and the
# native sandbox has an adapter on Linux and macOS only. This build's sandbox
# service runs commands in Docker on the developer's machine, so the release
# targets stay those two.
release:
  targets: [linux-x64, darwin-arm64]
  sources: [https://registry.npmjs.org]
  vulnerabilities:
    failOn: high
    allow:
      # Reviewed exception, tc3oliver/piship#129. Remove when upstream Pi
      # ships a fixed brace-expansion; on expiry the release gate fails again.
      - id: GHSA-qhr7-859c-m2p7
        reason: Transitive dependency pinned by upstream Pi's shrinkwrap; local stack-exhaustion DoS from crafted nested brace patterns. PiShip does not patch upstream Pi dependency trees. Temporary.
        expires: 2026-12-31
      - id: GHSA-6j4f-fj2g-mc7p
        reason: Transitive dependency pinned by upstream Pi's shrinkwrap; local stack-exhaustion DoS from crafted nested brace patterns. PiShip does not patch upstream Pi dependency trees. Temporary.
        expires: 2026-12-31
