# LiteLLM proxy configuration for a PiShip gateway (illustrative).
# model_name values are the IDs PiShip sends and lists in models.allowed.
# Upstream models and keys are your choice; secrets come from the environment.
model_list:
  - model_name: acme/coder
    litellm_params:
      model: openai/gpt-4.1
      api_key: os.environ/OPENAI_API_KEY
  - model_name: acme/general
    litellm_params:
      model: openai/gpt-4.1-mini
      api_key: os.environ/OPENAI_API_KEY

litellm_settings:
  # Drop OpenAI request parameters that an upstream provider does not accept.
  drop_params: true

general_settings:
  # Used only by your broker to create and delete virtual keys.
  master_key: os.environ/LITELLM_MASTER_KEY
  # Virtual keys need a database.
  database_url: os.environ/DATABASE_URL
